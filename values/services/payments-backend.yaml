# payments-backend — Stripe, subscriptions, grants entitlements. ClusterIP only (BFF/siblings reach it in-cluster).
app:
  name: payments-backend
  image:
    repository: ghcr.io/outegro/monorepo/payments-backend
    tag: "ba96e27e9a33db2aeddb527ad1416c83417b8bd1"
  # 1 while the service is still a scaffold (no domain code, no Prisma models, no tables).
  # Back to 2 when the Lava.top integration lands and it starts holding real payment state.
  replicas: 1
  port: 3000
  livenessPath: /health
  readinessPath: /health/deep
  startupPath: /health
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # DATABASE_URL / DATABASE_URL_DIRECT from this sealed secret (envFrom).
  envSecretName: payments-backend-env
  env:
    - name: NODE_ENV
      value: "production"
service:
  type: clusterip
networkPolicy:
  enabled: true
  allowExternalHttps: false
# No migrations yet (schema has no models). Flip to true with the first migration.
migration:
  enabled: false
