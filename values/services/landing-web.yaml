# landing-web — outegro.com landing (keeper). Next 16 standalone + BFF.
app:
  name: landing-web
  image:
    repository: ghcr.io/outegro/monorepo/landing-web
    tag: "83b7de567b24c4c5d1e5e97e54430ab0713a7b3d"
  replicas: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 384Mi
  # BFF has no secrets of its own; it talks to example-api over ClusterIP.
  env:
    - name: NODE_ENV
      value: "production"
    - name: API_BASE
      value: "http://example-api.platform.svc.cluster.local:3000"
  # No envFrom secret needed — point at a dummy so the chart's secretRef is optional.
  envSecretName: landing-web-env

service:
  type: clusterip+ingress

ingress:
  enabled: true
  className: traefik
  host: outegro.com
  tlsSecretName: outegro-wildcard-tls

networkPolicy:
  enabled: true
  allowExternalHttps: false
  # Traefik (kube-system) → pod:3000. Chart default only allows same-namespace ingress.
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP
