# landing-web — outegro.com landing (keeper). Next 16 standalone + BFF.
app:
  name: landing-web
  image:
    repository: ghcr.io/outegro/monorepo/landing-web
    tag: "7f762bebb4443042fc1aeaf899dc1103c20ee3f8"
  replicas: 2
  port: 3000
  # Probes hit "/" (SSR shell, always 200 while the Next server is up). We deliberately
  # do NOT probe the deep /api/health here: it proxies the backend and 503s on a backend
  # blip — that must not kill the landing or pull it from the LB. The BFF routes handle
  # backend errors per-request; the page itself must stay servable.
  livenessPath: /
  readinessPath: /
  startupPath: /
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 384Mi
  # Pure front hub — no backend, no secrets of its own.
  env:
    - name: NODE_ENV
      value: "production"
  # No envFrom secret needed — point at a dummy so the chart's secretRef is optional.
  envSecretName: landing-web-env
service:
  type: clusterip+ingress
ingress:
  enabled: true
  className: traefik
  host: outegro.com
  tlsSecretName: outegro-wildcard-tls
networkPolicy:
  enabled: true
  allowExternalHttps: false
  # Traefik (kube-system) → pod:3000. Chart default only allows same-namespace ingress.
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP
