# edu-web — edu.outegro.com. Korean-learning UI + BFF over edu-backend (ClusterIP-only). Shares Outegro ID SSO.
app:
  name: edu-web
  image:
    repository: ghcr.io/outegro/monorepo/edu-web
    tag: "ac6f3559e2f7bbbbd0977b0e37cbd4212fbc1651"
  replicas: 2
  port: 3000
  # Front: probe "/" (SSR shell, always 200 while Next is up). Do NOT probe BFF routes —
  # they proxy edu-backend and a backend blip must not pull edu-web from the LB.
  livenessPath: /
  readinessPath: /
  startupPath: /
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # BFF config (all non-secret). auth-backend / edu-backend are ClusterIP :80 in the same namespace.
  env:
    - name: NODE_ENV
      value: "production"
    - name: AUTH_API_BASE
      value: "http://auth-backend:80"
    - name: EDU_API_BASE
      value: "http://edu-backend:80"
    - name: ID_ORIGIN
      value: "https://id.outegro.com"
    - name: PUBLIC_ORIGIN
      value: "https://edu.outegro.com"
    - name: COOKIE_DOMAIN
      value: ".outegro.com"
    - name: REFRESH_COOKIE
      value: "outegro_refresh"
  envSecretName: edu-web-env
service:
  type: clusterip+ingress
ingress:
  enabled: true
  className: traefik
  host: edu.outegro.com
  tlsSecretName: outegro-wildcard-tls
networkPolicy:
  enabled: true
  allowExternalHttps: false
  # Traefik (kube-system) → pod:3000.
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP
