# itmaxxing-backend — job-hunt copilot (lore intake). Freeform career text → LLM review
# (sharpened text + red flags) → structured lore_entries. Stateless auth (JWKS), own CNPG db,
# calls MiniMax over the internet. ClusterIP; itmaxxing-web BFF reaches it in-cluster.
app:
  name: itmaxxing-backend
  image:
    repository: ghcr.io/outegro/monorepo/itmaxxing-backend
    tag: "2283f8cc041d716e4d8cc56760e833ecf185acae" # bumped by CI to the built SHA
  replicas: 2
  port: 3000
  livenessPath: /health
  readinessPath: /health/deep
  startupPath: /health
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 320Mi
  # DATABASE_URL / DATABASE_URL_DIRECT / LLM_API_KEY from this sealed secret (envFrom).
  envSecretName: itmaxxing-backend-env
  env:
    - name: NODE_ENV
      value: "production"
    # LLM (OpenAI-compatible). Model must match what the shared MiniMax key serves; M2 is a
    # reasoning model (<think>…), so keep max_tokens generous or JSON output truncates.
    - name: LLM_BASE_URL
      value: "https://api.minimax.io/v1"
    - name: LLM_MODEL
      value: "MiniMax-M2"
    - name: LLM_MAX_TOKENS
      value: "4096"
service:
  type: clusterip
networkPolicy:
  enabled: true
  # MiniMax LLM API is reached over the internet → allow egress HTTPS.
  # (JWKS is in-cluster: JWKS_URL defaults to http://auth-backend:80.)
  allowExternalHttps: true
# LLM cost/latency metrics (minimax_* series), moved here from edu-backend when edu was
# removed. Feeds the "Outegro — AI (MiniMax)" Grafana dashboard, which filters only on the
# series names, so it works unchanged. Matters more here than it did for edu: M2 is a
# reasoning model and its billed reasoning_tokens dominate the cost of /intake and /structure.
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
# First migration (Profile / LoreEntry / Generation) runs as an Argo PreSync Job against
# DATABASE_URL_DIRECT.
migration:
  enabled: true
  databaseUrlKey: DATABASE_URL_DIRECT
