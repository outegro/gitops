# auth-backend — identity, sessions, JWT/JWKS, entitlements. ClusterIP only (BFF/siblings reach it in-cluster).
app:
  name: auth-backend
  image:
    repository: ghcr.io/outegro/monorepo/auth-backend
    tag: "b5f11538741753941f69bd9277761b15ca418a2d"
  replicas: 2
  port: 3000
  livenessPath: /health
  readinessPath: /health/deep
  startupPath: /health
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # DATABASE_URL / DATABASE_URL_DIRECT from this sealed secret (envFrom).
  envSecretName: auth-backend-env
  env:
    - name: NODE_ENV
      value: "production"
service:
  type: clusterip
networkPolicy:
  enabled: true
  allowExternalHttps: false
# No migrations yet (schema has no models). Flip to true with the first migration.
migration:
  enabled: false
