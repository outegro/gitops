# auth-backend — identity, sessions, JWT/JWKS, entitlements. ClusterIP only (BFF/siblings reach it in-cluster).
app:
  name: auth-backend
  image:
    repository: ghcr.io/outegro/monorepo/auth-backend
    tag: "389091ddc72f612f9d155d531a7ef38792dd8cc2"
  replicas: 2
  port: 3000
  livenessPath: /health
  readinessPath: /health/deep
  startupPath: /health
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # DATABASE_URL / DATABASE_URL_DIRECT from this sealed secret (envFrom).
  envSecretName: auth-backend-env
  env:
    - name: NODE_ENV
      value: "production"
service:
  type: clusterip
networkPolicy:
  enabled: true
  allowExternalHttps: true
# First migration (users/identities/login_codes/sessions/entitlements/
# webauthn_credentials/outbox) runs as an Argo PreSync Job against DATABASE_URL_DIRECT.
migration:
  enabled: true
  databaseUrlKey: DATABASE_URL_DIRECT
