# id-web — id.outegro.com. Sign-in / account UI. Next 16 standalone (hello placeholder for now).
app:
  name: id-web
  image:
    repository: ghcr.io/outegro/monorepo/id-web
    tag: "b5f11538741753941f69bd9277761b15ca418a2d"
  replicas: 2
  port: 3000
  # Front: probe "/" (SSR shell). No backend dep yet.
  livenessPath: /
  readinessPath: /
  startupPath: /
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    - name: NODE_ENV
      value: "production"
  envSecretName: id-web-env
service:
  type: clusterip+ingress
ingress:
  enabled: true
  className: traefik
  host: id.outegro.com
  tlsSecretName: outegro-wildcard-tls
networkPolicy:
  enabled: true
  allowExternalHttps: false
  # Traefik (kube-system) → pod:3000.
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP
