# id-web — id.outegro.com. Sign-in / account UI + BFF over auth-backend (ClusterIP-only).
app:
  name: id-web
  image:
    repository: ghcr.io/outegro/monorepo/id-web
    tag: "aa76260bb8d9cad63ce6b622649338d15df70040"
  replicas: 2
  port: 3000
  # Front: probe "/" (SSR shell, always 200 while Next is up). Do NOT probe BFF routes —
  # they proxy auth-backend and a backend blip must not pull id-web from the LB.
  livenessPath: /
  readinessPath: /
  startupPath: /
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # BFF config (all non-secret). auth-backend is ClusterIP :80 in the same namespace.
  env:
    - name: NODE_ENV
      value: "production"
    - name: AUTH_API_BASE
      value: "http://auth-backend:80"
    - name: NOTIFY_API_BASE
      value: "http://notifications-backend:80"
    - name: PUBLIC_ORIGIN
      value: "https://id.outegro.com"
    - name: COOKIE_DOMAIN
      value: ".outegro.com"
    - name: REFRESH_COOKIE
      value: "outegro_refresh"
  envSecretName: id-web-env
service:
  type: clusterip+ingress
ingress:
  enabled: true
  className: traefik
  host: id.outegro.com
  tlsSecretName: outegro-wildcard-tls
networkPolicy:
  enabled: true
  allowExternalHttps: false
  # Traefik (kube-system) → pod:3000.
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP
