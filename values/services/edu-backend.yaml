# edu-backend — Korean-learning courses, AI homework checking, vocab. ClusterIP only (edu-web BFF reaches it in-cluster).
app:
  name: edu-backend
  image:
    repository: ghcr.io/outegro/monorepo/edu-backend
    tag: "c6cdd4299ab7230c872deffa66e8074f14bcd1ea"
  replicas: 2
  port: 3000
  livenessPath: /health
  readinessPath: /health/deep
  startupPath: /health
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # DATABASE_URL / DATABASE_URL_DIRECT / RABBITMQ_URL / LLM_API_KEY from this sealed secret (envFrom).
  envSecretName: edu-backend-env
  env:
    - name: NODE_ENV
      value: "production"
    # MiniMax M3 is a reasoning model (<think>); llm.service strips the think block.
    # Base URL + max_tokens(4096) come from env.validation defaults (api.minimax.io/v1).
    - name: LLM_MODEL
      value: "MiniMax-M3"
service:
  type: clusterip
# Prometheus scrapes GET /metrics → "Outegro — AI (MiniMax)" Grafana dashboard.
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
networkPolicy:
  enabled: true
  # LLM provider (api.minimax.io) is reached over the internet → allow egress HTTPS.
  # (JWKS is in-cluster: JWKS_URL defaults to http://auth-backend:80.)
  allowExternalHttps: true
  # Let Prometheus (observability ns) scrape :3000/metrics.
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 3000
          protocol: TCP
# First migration (Course/Chapter/Enrollment/HomeworkSubmission/VocabEntry/OutboxEvent + Korean seed)
# runs as an Argo PreSync Job against DATABASE_URL_DIRECT.
migration:
  enabled: true
  databaseUrlKey: DATABASE_URL_DIRECT
