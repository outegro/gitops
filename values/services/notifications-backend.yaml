# notifications-backend — consumes domain events, delivers email/Telegram. ClusterIP only (BFF/siblings reach it in-cluster).
app:
  name: notifications-backend
  image:
    repository: ghcr.io/outegro/monorepo/notifications-backend
    tag: "a129b7c062dd5eb1a1f29c08a289c39cc67e8d49"
  replicas: 2
  port: 3000
  livenessPath: /health
  readinessPath: /health/deep
  startupPath: /health
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # All env from this sealed secret (envFrom): DATABASE_URL, DATABASE_URL_DIRECT,
  # RABBITMQ_URL, RESEND_API_KEY, RESEND_FROM, INTERNAL_API_KEY (+ TELEGRAM_* later).
  envSecretName: notifications-backend-env
  env:
    - name: NODE_ENV
      value: "production"
service:
  type: clusterip
networkPolicy:
  enabled: true
  # Outbound HTTPS required: Resend (api.resend.com) + Telegram (api.telegram.org).
  allowExternalHttps: true
# First migration (delivery_log / preferences / telegram_links) runs as an Argo
# PreSync Job from the service image, against DATABASE_URL_DIRECT.
migration:
  enabled: true
  databaseUrlKey: DATABASE_URL_DIRECT
