# kube-prometheus-stack: Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter.

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # Mounts Secret `outegro-telegram-alert` (sealed, ns observability) at
    # /etc/alertmanager/secrets/outegro-telegram-alert/token → bot_token_file below.
    secrets:
      - outegro-telegram-alert
  # Route ALL alerts to a single Telegram receiver. Group by alert+namespace so a
  # burst collapses into one message; re-notify an ongoing alert at most every 4h.
  # NB: this REPLACES the chart's default config. The default `route.routes` muted
  # the always-firing `Watchdog` to a `null` receiver; we must keep BOTH that route
  # AND a `null` receiver, else the operator rejects the config with
  # "undefined receiver null used in route".
  config:
    route:
      receiver: telegram
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog (pipeline heartbeat) and InfoInhibitor (inhibit helper) are synthetic
        # always-on alerts, never actionable — mute to null so they don't spam Telegram.
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/outegro-telegram-alert/token
            chat_id: -1004470192592
            parse_mode: HTML
            send_resolved: true

grafana:
  enabled: true
  replicas: 1
  # ⚠️ Grafana subchart ждёт admin.* — НЕ top-level existingSecret. С неверной вложенностью
  # чарт генерит СЛУЧАЙНЫЙ пароль в Secret/prometheus-grafana при каждом рендере →
  # вечный OutOfSync на Secret/Deployment prometheus-grafana в Argo.
  admin:
    existingSecret: grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: observability
    datasources:
      enabled: true
      searchNamespace: observability

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# k3s bundles control-plane components into one process and does NOT expose them as
# separate scrape targets → these monitors fail and fire false-positive *Down alerts
# (KubeScheduler/KubeProxy/KubeControllerManager/etcd Down). Disable both their
# ServiceMonitors AND the associated default rules so they don't spam Telegram.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

additionalPrometheusRulesMap: {}
