# RabbitMQ via the official RabbitMQ Cluster Operator.
#
# The cluster-wide operator is installed separately (see 3-platform-core MANUAL step 9):
#   kubectl apply -f https://github.com/rabbitmq/cluster-operator/releases/download/v2.21.1/cluster-operator.yml
#
# Credentials: the operator AUTO-GENERATES admin user/password into Secret
# `rabbitmq-default-user` (namespace infra). Apps read that secret — there is
# NO `rabbitmq-credentials` sealed secret anymore.
# Service: `rabbitmq.infra.svc` (amqp 5672, management 15672, prometheus 15692).
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: infra
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  replicas: 1
  # RabbitMQ operator требует memory request == limit (иначе high-watermark считается
  # неверно → warning + медленный boot → startup probe не успевает). 1Gi хватает на boot.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    storageClassName: local-path
    storage: 10Gi
  rabbitmq:
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_prometheus
