# Minimal Prometheus alerts for the single-node platform.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: outegro-platform-alerts
  namespace: observability
  labels:
    release: prometheus
    app.kubernetes.io/component: rules
spec:
  groups:
    - name: outegro-platform
      interval: 30s
      rules:
        - alert: CertManagerDown
          expr: |
            kube_deployment_status_replicas_available{namespace="cert-manager", deployment="cert-manager"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cert-manager controller is unavailable"
            description: "cert-manager не выпускает и не продлевает сертификаты."

        - alert: SealedSecretsDown
          expr: |
            kube_deployment_status_replicas_available{namespace="kube-system", deployment="sealed-secrets-controller"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Sealed Secrets controller is unavailable"
            description: "Новые SealedSecret не будут расшифрованы."

        - alert: RedisDown
          expr: |
            kube_statefulset_status_replicas_ready{namespace="infra", statefulset="redis"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Redis is unavailable"
            description: "Redis StatefulSet не имеет ready-реплики."

        - alert: RabbitMQDown
          expr: |
            kube_statefulset_status_replicas_ready{namespace="infra", statefulset="rabbitmq-server"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "RabbitMQ is unavailable"
            description: "RabbitMQ StatefulSet не имеет ready-реплики."

        - alert: PostgresPodDown
          expr: |
            kube_pod_status_ready{namespace="infra", pod="outegro-1", condition="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Postgres pod is not ready"
            description: "CNPG pod outegro-1 не готов."

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting"
            description: "Контейнер {{ $labels.container }} часто рестартится."

        # PodCrashLooping counts RESTARTS, so it is structurally blind to a container that
        # never starts at all. During the budget/itmaxxing rollout two pods sat in
        # ImagePullBackOff for 40 minutes (bad image tag) and nothing fired.
        - alert: PodImagePullFailing
          expr: |
            kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
            description: >-
              Контейнер {{ $labels.container }} не может скачать образ ({{ $labels.reason }}).
              Обычно это несуществующий тег в values или отсутствующий pull-секрет.

        # A full ResourceQuota rejects every new pod, including Argo PreSync migration Jobs,
        # and Argo only reports a vague "Job was active longer than specified deadline".
        # This is what silently blocked the budget/itmaxxing deploy at exactly 5Gi/5Gi.
        - alert: ResourceQuotaNearLimit
          expr: |
            kube_resourcequota{type="used"}
              / ignoring(type) kube_resourcequota{type="hard"} > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Quota {{ $labels.namespace }}/{{ $labels.resourcequota }} is above 85% on {{ $labels.resource }}"
            description: >-
              Использовано {{ $value | humanizePercentage }} лимита {{ $labels.resource }}.
              На 100% новые поды перестанут создаваться (exceeded quota).

    - name: outegro-node
      interval: 30s
      rules:
        - alert: NodeMemoryHigh
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is above 90%"
            description: "Нода {{ $labels.instance }} близка к OOM."

        - alert: NodeDiskHigh
          expr: |
            (1 - (node_filesystem_avail_bytes{fstype!="tmpfs", mountpoint="/"} / node_filesystem_size_bytes{fstype!="tmpfs", mountpoint="/"})) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Root filesystem usage is above 85%"
            description: "Корневой диск ноды {{ $labels.instance }} заполнен."
