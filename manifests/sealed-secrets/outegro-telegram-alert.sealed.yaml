# Telegram bot token for Alertmanager → Telegram alerts.
# Decrypts to Secret `outegro-telegram-alert` (key: token) in `observability`,
# mounted into Alertmanager via values/observability/prometheus.yaml
# (alertmanager.alertmanagerSpec.secrets) at
# /etc/alertmanager/secrets/outegro-telegram-alert/token.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: outegro-telegram-alert
  namespace: observability
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: outegro-telegram-alert
      namespace: observability
