# pgbouncer перед кластером outegro (CNPG-managed Pooler). Приложения коннектятся
# к сервису `example-pooler` (а не напрямую к outegro-rw) — pgbouncer мультиплексирует
# много клиентских коннектов на маленький пул серверных, защищая Postgres от исчерпания
# коннектов и экономя память на single-box (каждый PG-бэкенд ~5–10MB).
#
# transaction-режим: серверный коннект возвращается в пул после КАЖДОЙ транзакции →
# реальное мультиплексирование. С @prisma/adapter-pg (node-postgres, unnamed prepared
# statements) это безопасно — отдельный `?pgbouncer=true` не нужен.
#
# Миграции (DDL/advisory locks) ходят НАПРЯМУЮ (DATABASE_URL_DIRECT → outegro-rw), не через пул.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: example-pooler
  namespace: infra
spec:
  cluster:
    name: outegro
  instances: 2 # rolling-restart без обрыва БД для приложения
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200" # сколько клиентских коннектов принимаем
      default_pool_size: "10" # сколько серверных коннектов держим к Postgres (на пользователя/БД)
