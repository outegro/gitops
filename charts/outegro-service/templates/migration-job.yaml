{{- if .Values.migration.enabled }}
# Prisma migrate-deploy as an Argo CD PreSync hook: runs `prisma migrate deploy`
# from the SAME service image BEFORE the Deployment rolls out. Forward-only +
# backward-compatible migrations (the old pods keep running until this succeeds).
# Requires `prisma` in the image's prod deps + prisma.config.ts (Dockerfile.nest ships both).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "outegro.fullname" . }}-migrate
  labels: {{- include "outegro.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "outegro.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          # Migrations go DIRECT to Postgres (bypass any pooler — they take advisory locks).
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-env" (include "outegro.fullname" .)) .Values.app.envSecretName | quote }}
                  key: {{ .Values.migration.databaseUrlKey | quote }}
          resources:
            {{- toYaml (.Values.migration.resources | default .Values.app.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # prisma writes temp files (os.tmpdir) → root FS must be writable here.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
{{- end }}
