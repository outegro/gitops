apiVersion: v1
kind: Service
metadata:
  name: {{ include "outegro.fullname" . }}
  labels: {{- include "outegro.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "outegro.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
