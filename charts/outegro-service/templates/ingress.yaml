{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "outegro.fullname" . }}
  labels: {{- include "outegro.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- /*
            extraPaths route specific prefixes on THIS host to a DIFFERENT service —
            e.g. budget-web's `/socket.io` → budget-backend (the WS gateway). Listed
            BEFORE `/` so the more-specific prefix wins. The browser stays same-origin,
            so the httpOnly og_access cookie rides the WS handshake and the gateway
            auth-gates it. Empty for every other service.
          */}}
          {{- range .Values.ingress.extraPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort | default 80 }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "outegro.fullname" . }}
                port:
                  number: 80
{{- end }}
