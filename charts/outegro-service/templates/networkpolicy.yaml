{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "outegro.fullname" . }}
  labels: {{- include "outegro.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "outegro.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Same-namespace traffic to the pod (BFF → backend, etc.)
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.app.port }}
          protocol: TCP
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS (kube-dns / coredns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        - port: 5432
          protocol: TCP
    # Redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        - port: 6379
          protocol: TCP
    # RabbitMQ
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
      ports:
        - port: 5672
          protocol: TCP
    # Inter-service calls (e.g. notifications → auth JWKS, BFF → backend in another ns).
    # Ограничено ns приложений (zero-trust: не любой ns, а только platform/services).
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["platform", "services"]
      ports:
        - port: 3000
          protocol: TCP
    {{- if .Values.networkPolicy.allowExternalHttps }}
    # External HTTPS: Google OIDC, Resend, Stripe, Telegram API, etc.
    # Всё наружу, КРОМЕ кластерных CIDR — чтобы egress нельзя было повернуть на внутренние сервисы.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
