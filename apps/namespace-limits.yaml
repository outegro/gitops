# Single-box guardrails: ResourceQuota + LimitRange for the `platform` namespace.
# Wave 2 — after namespaces exist, before/independent of the services (wave 8).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-limits
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: outegro
  source:
    repoURL: git@github.com:outegro/gitops.git
    targetRevision: main
    path: manifests/namespace-limits
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
