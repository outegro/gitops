apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # kube-prometheus CRDs огромные → client-side diff даёт ложный OutOfSync (defaults,
    # last-applied-annotation). ServerSideDiff считает дифф через dry-run apply на apiserver —
    # уважает дефолты/мутации, дифф чистый. Пара к ServerSideApply ниже.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: outegro
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 86.2.3
      helm:
        valueFiles:
          - $values/values/observability/prometheus.yaml
    - repoURL: git@github.com:outegro/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack CRD (prometheuses/alertmanagers) большие → client-side OutOfSync.
      - ServerSideApply=true
---
