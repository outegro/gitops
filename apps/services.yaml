# Self-written services (outegro-service chart + per-app values). Wave 8 — after
# all infra (secrets/CNPG/Redis/RabbitMQ). Currently: landing-web (the outegro.com hub).
# auth/notifications/payments + id/pay land here once their deploy wiring is ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landing-web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: outegro
  sources:
    - repoURL: git@github.com:outegro/gitops.git
      targetRevision: main
      path: charts/outegro-service
      helm:
        releaseName: landing-web
        valueFiles:
          - $values/values/services/landing-web.yaml
    - repoURL: git@github.com:outegro/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
