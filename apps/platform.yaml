apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: outegro
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.18.6
      helm:
        # Release name MUST equal the bootstrap install ("sealed-secrets-controller").
        # The chart derives `app.kubernetes.io/instance` from the release name, and that
        # label is part of the Deployment's IMMUTABLE selector. Без этого Argo рендерит
        # instance=sealed-secrets → вечный OutOfSync (селектор не переписать на месте).
        releaseName: sealed-secrets-controller
        valueFiles:
          - $values/values/platform/sealed-secrets.yaml
    - repoURL: git@github.com:outegro/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
