apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: outegro
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.28.3
      helm:
        # Must match manual bootstrap release in chapter 3.
        releaseName: cnpg
        valueFiles:
          - $values/values/platform/cnpg-operator.yaml
    - repoURL: git@github.com:outegro/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Оператор в cnpg-system (его канон-ns). barman-plugin ОБЯЗАН быть в том же ns
    # (иначе "unknown plugin being required"). Postgres-Cluster живёт в infra.
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CNPG CRD `clusters` огромный → client-side apply упирается в лимит аннотации. SSA обязателен.
      - ServerSideApply=true
---
# Barman Cloud Plugin — вендоренный pinned-манифест v0.13.0 (содержит cert-manager
# Issuer/Certificate → требует cert-manager из wave 1). Не тянем из upstream-git:
# release-артефакт manifest.yaml не лежит в корне репо на теге.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: outegro
  source:
    repoURL: git@github.com:outegro/gitops.git
    targetRevision: main
    path: manifests/cnpg-barman-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    # Оператор CNPG домутирует Cluster spec (раздувает postgresql.parameters ~8→35,
    # добавляет managed.roles defaults). client-side diff видит это как дрейф → вечный
    # OutOfSync. ServerSideDiff сравнивает только Argo-managed поля (как у prometheus).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: outegro
  source:
    repoURL: git@github.com:outegro/gitops.git
    targetRevision: main
    path: manifests/cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Оператор домутирует Cluster spec (defaults) → client-side показывает дрейф. SSA.
      - ServerSideApply=true
---
