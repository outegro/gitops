# SealedSecrets как код. Реальные *.sealed.yaml лежат в manifests/sealed-secrets/
# (зашифрованы → безопасны в Git). Контроллер (app `sealed-secrets`, wave 0)
# расшифровывает их в обычные Secret. Каждый SealedSecret несёт свой metadata.namespace.
#
# prune:false — намеренно: удаление файла не сносит живой секрет (защита).
# Namespace создаются в главе 2 до bootstrap; CreateNamespace здесь подстраховывает
# только destination namespace приложения.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    # После sealed-secrets controller/CRD (wave 0), до consumers secrets.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: outegro
  source:
    repoURL: git@github.com:outegro/gitops.git
    targetRevision: main
    path: manifests/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
